<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNDOCHEM 작업일지</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <!-- 스타일 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 lg:p-6 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-[1500px] flex-1 flex flex-col">
        
        <!-- 상단 헤더 및 결재란 -->
        <div class="flex flex-col gap-4 mb-4">
            
            <div class="flex justify-between items-center w-full relative z-20">
                <div class="flex-1 flex items-center gap-3">
                    <!-- 날짜 이동 좌우 화살표 버튼 -->
                    <div class="flex items-center bg-[#1e293b] p-1 rounded-xl border border-slate-600 shadow-md no-print">
                        <button onclick="changeDate(-1)" class="w-9 h-9 flex items-center justify-center bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-amber-400 rounded-lg transition font-bold" title="전날로 이동 (Alt+←)">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button onclick="goToday()" class="px-2.5 h-9 text-xs font-bold text-slate-300 hover:text-white transition" title="오늘 날짜로 이동">
                            오늘
                        </button>
                        <button onclick="changeDate(1)" class="w-9 h-9 flex items-center justify-center bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-amber-400 rounded-lg transition font-bold" title="다음날로 이동 (Alt+→)">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
                
                <!-- 날짜 선택 박스 -->
                <div class="flex items-center gap-3 bg-[#1e293b] px-6 py-2 rounded-full border border-slate-600 shadow-inner print:border-none print:bg-transparent shrink-0">
                    <span class="text-slate-400 font-bold text-sm tracking-widest print:text-black">근무일자:</span>
                    <input type="date" id="log-date" class="bg-transparent border-none text-xl font-black text-amber-400 outline-none cursor-pointer print:text-black text-center">
                    <span id="log-day" class="text-xl font-black text-amber-400 ml-1 print:text-black"></span>
                </div>
                
                <!-- 상단 제어 버튼 -->
                <div class="flex-1 flex justify-end gap-2 no-print shrink-0">
                    <button onclick="toggleFullScreen()" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded border border-slate-600 font-bold transition flex items-center gap-2 text-xs shadow-md"><i class="fas fa-expand"></i> 전체화면</button>
                    <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded border border-slate-600 font-bold transition flex items-center gap-2 text-xs shadow-md"><i class="fas fa-print"></i> 인쇄</button>
                    <button onclick="logout()" class="bg-rose-900 hover:bg-rose-800 text-white px-3 py-1.5 rounded border border-rose-700 font-bold transition flex items-center gap-2 text-xs shadow-md"><i class="fas fa-right-from-bracket"></i> 로그아웃</button>
                </div>
            </div>

            <!-- 타이틀 및 결재란 -->
            <div class="flex justify-between items-end">
                
                <div class="flex items-center gap-4 bg-pink-950/20 px-6 py-3 rounded-2xl border border-pink-500/30 shadow-[0_0_15px_rgba(236,72,153,0.15)]">
                    <div class="bg-pink-500/20 p-2.5 rounded-xl border border-pink-500/50">
                        <i class="fas fa-clipboard-list text-[2.5rem] text-pink-400 no-print"></i>
                    </div>
                    <h1 class="text-[3rem] font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-rose-400 tracking-widest drop-shadow-md print:text-2xl print:text-black">작 업 일 지</h1>
                </div>

                <!-- 결재란 -->
                <div class="w-[550px] flex h-[121px] sign-box border border-slate-600 rounded-lg overflow-hidden shadow-inner print:shadow-none">
                    <div class="w-12 bg-slate-800 flex flex-col items-center justify-center text-slate-300 font-black text-base tracking-widest sign-title-box leading-tight border-r border-slate-600 print:bg-transparent print:text-black">
                        <span>결</span><span>재</span>
                    </div>
                    <div class="grid grid-cols-4 bg-[#0f172a] print:bg-transparent flex-1">
                        <div class="bg-slate-700/60 print:bg-transparent border-r border-b border-slate-600 flex items-center justify-center py-1.5 text-slate-300 print:text-black font-bold text-sm sign-label">담 당</div>
                        <div class="bg-slate-700/60 print:bg-transparent border-r border-b border-slate-600 flex items-center justify-center py-1.5 text-slate-300 print:text-black font-bold text-sm sign-label">검 토 1</div>
                        <div class="bg-slate-700/60 print:bg-transparent border-r border-b border-slate-600 flex items-center justify-center py-1.5 text-slate-300 print:text-black font-bold text-sm sign-label">검 토 2</div>
                        <div class="bg-slate-700/60 print:bg-transparent border-b border-slate-600 flex items-center justify-center py-1.5 text-slate-300 print:text-black font-bold text-sm sign-label">승 인</div>
                        
                        <div class="border-r border-slate-600 sign-input-wrapper"><textarea id="job_sign_draft" class="att-cell text-center text-slate-200 print:text-black font-bold sync-item pt-4" placeholder="(서명)" spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea></div>
                        <div class="border-r border-slate-600 sign-input-wrapper"><textarea id="job_sign_rev1" class="att-cell text-center text-slate-200 print:text-black font-bold sync-item pt-4" placeholder="(서명)" spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea></div>
                        <div class="border-r border-slate-600 sign-input-wrapper"><textarea id="job_sign_rev2" class="att-cell text-center text-slate-200 print:text-black font-bold sync-item pt-4" placeholder="(서명)" spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea></div>
                        <div class="sign-input-wrapper"><textarea id="job_sign_appr" class="att-cell text-center text-slate-200 print:text-black font-bold sync-item pt-4" placeholder="(서명)" spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea></div>
                    </div>
                </div>
                
            </div>
        </div>

        <!-- 메인 작업일지 양식 테이블 -->
        <div class="main-table-wrapper border-[3px] border-pink-500 rounded-xl overflow-hidden flex-col shadow-[0_0_20px_rgba(236,72,153,0.2)] bg-[#0f172a]">
            
            <!-- 1. 작업일자 -->
            <div class="job-row min-h-[40px] row-height-date">
                <div class="row-header">작 업 일 자</div>
                <div class="input-wrapper px-4 font-bold text-amber-400 text-lg print:text-black">
                    <span id="display-job-date"></span>
                </div>
            </div>

            <!-- 2. 작업자 -->
            <div class="job-row min-h-[40px] row-height-worker">
                <div class="row-header">작 업 자</div>
                <div class="input-wrapper">
                    <textarea id="job_worker" class="att-cell sync-item" placeholder="작업자 성명 입력..." spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea>
                </div>
            </div>

            <!-- 3. 금일작업내용 (일반) -->
            <div class="job-row min-h-[220px] row-height-today-gen">
                <div class="row-header flex-col gap-1">
                    <span>금일작업내용</span>
                    <span class="text-xs text-slate-400 font-normal">(일 반)</span>
                </div>
                <div class="input-wrapper">
                    <textarea id="job_today_general" class="att-cell sync-item p-3" placeholder="금일 진행된 일반 작업 내용을 작성하세요..." spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea>
                </div>
            </div>

            <!-- 4. 금일작업내용 (PSM 대상설비) -->
            <div class="job-row min-h-[90px] row-height-today-psm">
                <div class="row-header flex-col gap-1 border-l-4 border-l-amber-500">
                    <div class="flex items-center gap-1.5">
                        <span class="bg-amber-500/20 text-amber-400 text-[10px] px-1.5 py-0.5 rounded border border-amber-500/40 font-black psm-badge no-print">PSM</span>
                        <span>금일작업내용</span>
                    </div>
                    <span class="text-xs text-amber-300/80 font-normal print:text-black">(PSM 대상설비)</span>
                </div>
                <div class="input-wrapper">
                    <textarea id="job_today_psm" class="att-cell sync-item p-3" placeholder="PSM 대상 설비 관련 금일 작업 내용 입력..." spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea>
                </div>
            </div>

            <!-- 5. 명일작업내용 (일반) -->
            <div class="job-row min-h-[220px] row-height-tom-gen">
                <div class="row-header flex-col gap-1">
                    <span>명일작업내용</span>
                    <span class="text-xs text-slate-400 font-normal">(일 반)</span>
                </div>
                <div class="input-wrapper">
                    <textarea id="job_tomorrow_general" class="att-cell sync-item p-3" placeholder="내일 예정된 일반 작업 내용을 작성하세요..." spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea>
                </div>
            </div>

            <!-- 6. 명일작업내용 (PSM 대상설비) -->
            <div class="job-row min-h-[90px] row-height-tom-psm">
                <div class="row-header flex-col gap-1 border-l-4 border-l-amber-500">
                    <div class="flex items-center gap-1.5">
                        <span class="bg-amber-500/20 text-amber-400 text-[10px] px-1.5 py-0.5 rounded border border-amber-500/40 font-black psm-badge no-print">PSM</span>
                        <span>명일작업내용</span>
                    </div>
                    <span class="text-xs text-amber-300/80 font-normal print:text-black">(PSM 대상설비)</span>
                </div>
                <div class="input-wrapper">
                    <textarea id="job_tomorrow_psm" class="att-cell sync-item p-3" placeholder="PSM 대상 설비 관련 명일 예정 작업 입력..." spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea>
                </div>
            </div>

            <!-- 7. 수리 부속 -->
            <div class="job-row min-h-[65px] row-height-parts">
                <div class="row-header">수 리 부 속</div>
                <div class="input-wrapper">
                    <textarea id="job_parts" class="att-cell sync-item p-3" placeholder="사용된 수리 부속 및 교체 자재 품명/수량 기재..." spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea>
                </div>
            </div>

            <!-- 8. 수리요청사항 -->
            <div class="job-row min-h-[90px] row-height-req">
                <div class="row-header">수리요청사항</div>
                <div class="input-wrapper">
                    <textarea id="job_requests" class="att-cell sync-item p-3" placeholder="설비 정비, 점검 및 기타 수리 요청사항 작성..." spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" autocomplete="off"></textarea>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Firebase 및 데이터 연동 스크립트 -->
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
